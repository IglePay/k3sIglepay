apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: romeo188/iglepay:backend-latest # <-- usa tu imagen publicada en DockerHub o GHCR
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              value: "mysql://iglepay:iglepay.com%23@mariadb:3306/IglePayDB"
            - name: PORT
              value: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 4000
  type: ClusterIP


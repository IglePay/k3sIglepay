apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-xml-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-xml

  minReplicas: 2
  maxReplicas: 10

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   #  espera 5 minutos antes de bajar
      policies:
        - type: Pods
          value: 1                       # baja SOLO 1 pod
          periodSeconds: 60              # cada 60 segundos

    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2                       # puede subir 2 pods
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70


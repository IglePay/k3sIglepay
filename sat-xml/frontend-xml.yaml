apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-xml
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend-xml
  template:
    metadata:
      labels:
        app: frontend-xml
    spec:
      containers:
        - name: frontend-xml
          image: romeo188/frontend-xml:v1.0.5
          imagePullPolicy: Always
          ports:
            - containerPort: 7000
          env:
            - name: TZ
              value: America/Guatemala
          envFrom:
            - configMapRef:
                name: frontend-config
            - secretRef:
                name: frontend-secret

          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-xml
spec:
  selector:
    app: frontend-xml
  ports:
    - port: 80
      targetPort: 7000
  type: ClusterIP


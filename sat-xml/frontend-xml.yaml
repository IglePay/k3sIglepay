apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-xml
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend-xml
  template:
    metadata:
      labels:
        app: frontend-xml
    spec:
      containers:
        - name: frontend-xml
          image: romeo188/frontend-xml:v1.0.17
          imagePullPolicy: Always
          ports:
            - containerPort: 7000
          env:
            - name: TZ
              value: America/Guatemala
            - name: NODE_OPTIONS
              value: "--max-old-space-size=3072"
          envFrom:
            - configMapRef:
                name: frontend-config
            - secretRef:
                name: frontend-secret

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-xml
spec:
  selector:
    app: frontend-xml
  ports:
    - port: 80
      targetPort: 7000
  type: ClusterIP


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iglepay-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - iglepay.com
        - www.iglepay.com
        - api.iglepay.com
      secretName: iglepay-tls
  rules:
    - host: iglepay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.iglepay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000


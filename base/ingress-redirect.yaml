apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iglepay-redirect
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: iglepay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
    - host: api.iglepay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
    - host: mi.iglepay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
     
    - host: convertidor.iglepay.com     
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: convertidor-service 
                port:
                  number: 2000

    - host: data.10enconta.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-xml
                port:
                  number: 80

apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  APP_ENV: "prod"
  APP_DEBUG: "0"
  APP_URL: "https://tu-dominio.com"

  DEFAULT_URI: https://tu-dominio.com

  DATABASE_URL: "mysql://root:password@mariadb-service:3306/SelahDB?serverVersion=mariadb-11.0.0&charset=utf8mb4"

  MAILER_DSN: "smtp://resend:TU_API_KEY@smtp.resend.com:587"

  LIBREOFFICE_CONVERT_URL: "http://libreoffice-service:3000/forms/libreoffice/convert"

  S3_ENDPOINT: "https://<ACCOUNT_ID>.r2.cloudflarestorage.com"
  S3_BUCKET: "selah-evidencias"
